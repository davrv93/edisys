# EDISYS · compose local (y base del EC2). Proyecto «edisys», contenedores edisys_*.
# Puertos del host (alternos, para no chocar con otros proyectos):
#   4700 edge (entrada única) · 4710 api · 4730 login · 4754 postgres · 4790 S3 (Garage) · 4791 admin de Garage
#   4725 SMTP de Mailpit · 4726 interfaz web de Mailpit (el correo local no sale a terceros)
# Límites de memoria según §1.2 de docs/PASO_A_PASO_INTERFACES.md.
name: edisys

x-logs: &logs
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-api-env: &api-env
  DATABASE_URL: postgres://edisys:${POSTGRES_PASSWORD:-edisys}@postgres:5432/edisys?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:-desarrollo-local-cambia-este-secreto-de-32-bytes}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  URL_PUBLICA: ${URL_PUBLICA:-http://localhost:4700}
  APP_VERSION: ${APP_VERSION:-local}
  S3_ENDPOINT: s3:3900
  S3_REGION: garage
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GK0e615b1c2d3e4f5a6b7c8d9e}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-7d1f0c9b8a7e6d5c4b3a29181716151413121110a9b8c7d6e5f4a3b2c1d0e9f8}
  S3_BUCKET: ${S3_BUCKET:-edisys-privado}
  S3_SSL: "false"
  GARAGE_ADMIN_URL: http://s3:3903
  GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-garage-admin-local}
  # WhatsApp: «simulado» por defecto (no sale nada). Solo con WHATSAPP_MODO=evolution se envía de verdad.
  WHATSAPP_MODO: ${WHATSAPP_MODO:-simulado}
  EVOLUTION_URL: ${EVOLUTION_URL:-}
  EVOLUTION_INSTANCIA: ${EVOLUTION_INSTANCIA:-}
  EVOLUTION_APIKEY: ${EVOLUTION_APIKEY:-}
  WHATSAPP_WEBHOOK_TOKEN: ${WHATSAPP_WEBHOOK_TOKEN:-}
  # Correo: en local va a Mailpit (http://localhost:4726). CORREO_MODO=simulado no envía nada.
  CORREO_MODO: ${CORREO_MODO:-smtp}
  CORREO_DE: ${CORREO_DE:-EDISYS <no-responder@edisys.local>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PUERTO: ${SMTP_PUERTO:-1025}
  SMTP_USUARIO: ${SMTP_USUARIO:-}
  SMTP_CLAVE: ${SMTP_CLAVE:-}
  # Motor conversacional local (F1): vacío = apagado (el chatbot por reglas responde todo).
  # Para activarlo: make motor (baja modelos) y descomenta MOTOR_URL.
  MOTOR_URL: http://motor:8080
  # MOTOR_TOKEN:
  # SUNAT beta: credenciales de prueba del servidor (respaldan al edificio sin las suyas).
  SUNAT_BETA_URL: ${SUNAT_BETA_URL:-}
  SUNAT_BETA_USUARIO: ${SUNAT_BETA_USUARIO:-}
  SUNAT_BETA_CLAVE: ${SUNAT_BETA_CLAVE:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: edisys_postgres
    <<: *logs
    environment:
      POSTGRES_DB: edisys
      POSTGRES_USER: edisys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edisys}
      TZ: UTC
    command: >
      postgres -c shared_buffers=192MB -c work_mem=8MB -c max_connections=40
               -c effective_cache_size=1GB -c timezone=UTC
    ports: ["4754:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edisys -d edisys"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s

  # S3 compatible: Garage de un nodo (lo mismo que pide la guía para el EC2). MinIO ya no publica
  # imágenes libres; por eso se usa Garage también en local. El API habla S3 puro (minio-go).
  # El layout, la clave S3 y el cubo privado los crea `edisys preparar` por el API de administración.
  s3:
    image: dxflrs/garage:v2.1.0
    container_name: edisys_s3
    <<: *logs
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-4f2a9c1e7b3d5a8f0c6e2b9d4a7f1c3e5b8d0a2f6c9e1b4d7a3f5c8e0b2d6a9f}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-garage-admin-local}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - s3meta:/var/lib/garage/meta
      - s3data:/var/lib/garage/data
    ports: ["4790:3900", "4791:3903"]
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 5s

  # Buzón local: atrapa todo el correo que envía el API (SMTP 4725, web http://localhost:4726).
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: edisys_mailpit
    <<: *logs
    environment:
      MP_MAX_MESSAGES: 2000
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports: ["4725:1025", "4726:8025"]
    mem_limit: 64m
    restart: unless-stopped

  # Corre migraciones y la semilla (solo si la base está vacía; SEMBRAR=siempre para forzar) y termina.
  migrate:
    build:
      context: ./api
    image: ${EDISYS_REGISTRO:-edisys}/api:${EDISYS_TAG:-local}
    container_name: edisys_migrate
    <<: *logs
    command: ["preparar"]
    environment:
      <<: *api-env
      SEMBRAR: ${SEMBRAR:-si_vacia}
      SEMBRAR_PENDIENTES: ${SEMBRAR_PENDIENTES:-0}
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
    mem_limit: 128m
    restart: "no"

  api:
    image: ${EDISYS_REGISTRO:-edisys}/api:${EDISYS_TAG:-local}
    container_name: edisys_api
    <<: *logs
    command: ["serve"]
    environment:
      <<: *api-env
      GOMEMLIMIT: 200MiB
    ports: ["4710:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/edisys", "salud"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 5s

  login:
    build:
      context: ./login
    image: ${EDISYS_REGISTRO:-edisys}/login:${EDISYS_TAG:-local}
    container_name: edisys_login
    <<: *logs
    environment:
      EDISYS_API_INTERNO: http://api:8080
      NODE_OPTIONS: --max-old-space-size=128
      ORIGIN: ${URL_PUBLICA:-http://localhost:4700}
    ports: ["4730:3000"]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 192m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 5s

  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    image: ${EDISYS_REGISTRO:-edisys}/edge:${EDISYS_TAG:-local}
    container_name: edisys_edge
    <<: *logs
    ports: ["4700:80"]
    depends_on:
      api: { condition: service_healthy }
      login: { condition: service_started }
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 5s

  # Respaldos: pg_dump diario a las 02:00 de Lima + copia del cubo, 30 días en el volumen edisys_respaldos.
  # Copia externa opcional (S3/R2) con EXTERNO_REMOTO y RCLONE_CONFIG_<REMOTO>_*; desactivada por defecto.
  backup:
    build:
      context: ./backup
    image: ${EDISYS_REGISTRO:-edisys}/backup:${EDISYS_TAG:-local}
    container_name: edisys_backup
    <<: *logs
    environment:
      DATABASE_URL: postgres://edisys:${POSTGRES_PASSWORD:-edisys}@postgres:5432/edisys?sslmode=disable
      S3_BUCKET: ${S3_BUCKET:-edisys-privado}
      RCLONE_CONFIG_GARAGE_TYPE: s3
      RCLONE_CONFIG_GARAGE_PROVIDER: Other
      RCLONE_CONFIG_GARAGE_ENDPOINT: http://s3:3900
      RCLONE_CONFIG_GARAGE_REGION: garage
      RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-GK0e615b1c2d3e4f5a6b7c8d9e}
      RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-7d1f0c9b8a7e6d5c4b3a29181716151413121110a9b8c7d6e5f4a3b2c1d0e9f8}
      RETENCION_DIAS: ${RETENCION_DIAS:-30}
      RESPALDO_CRON: ${RESPALDO_CRON:-0 2 * * *}
      EXTERNO_REMOTO: ${EXTERNO_REMOTO:-}
      EXTERNO_RUTA: ${EXTERNO_RUTA:-edisys-respaldos}
      RCLONE_CONFIG_EXTERNO_TYPE: s3
      RCLONE_CONFIG_EXTERNO_PROVIDER: ${EXTERNO_PROVEEDOR:-Cloudflare}
      RCLONE_CONFIG_EXTERNO_ENDPOINT: ${EXTERNO_ENDPOINT:-}
      RCLONE_CONFIG_EXTERNO_ACCESS_KEY_ID: ${EXTERNO_ACCESS_KEY:-}
      RCLONE_CONFIG_EXTERNO_SECRET_ACCESS_KEY: ${EXTERNO_SECRET_KEY:-}
    volumes: [respaldos:/respaldos]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 128m
    restart: unless-stopped

  # Motor conversacional local (F1): app.py (RAG + memoria + sugerencias) frente a
  # llama-server con el GGUF local. Va apagado por defecto: `make motor` lo baja y
  # descomenta MOTOR_URL. La API lo llama solo si MOTOR_URL está definido y el
  # edificio tiene motor_activado.
  llama:
    profiles: [motor]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: edisys_llama
    <<: *logs
    command: >-
      -m ${MODELO_RUTA:-/models/edisys-motor-v1.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX:-2048}
      --threads ${LLAMA_THREADS:-2}
      --parallel 1
      --temp 0.3
    volumes: [./motor/models:/models:ro]
    mem_limit: ${MEM_LLAMA:-1450m}
    restart: unless-stopped

  motor:
    profiles: [motor]
    build: ./motor
    image: ${EDISYS_REGISTRO:-edisys}/motor:${EDISYS_TAG:-local}
    container_name: edisys_motor
    <<: *logs
    environment:
      E5_RUTA: /models/e5-model_quantized.onnx
      E5_TOK: /models/e5-tokenizer.json
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./motor/models:/models:ro
      - motor_indice:/motor/indice
    mem_limit: 400m
    depends_on: [llama]
    restart: unless-stopped

volumes:
  pgdata:
  s3meta:
  s3data:
  respaldos:
  motor_indice:
